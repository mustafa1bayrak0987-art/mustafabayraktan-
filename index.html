<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(3, 3, 10);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const WIDTH = 900;
        const HEIGHT = 900;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        const CX = WIDTH / 2;
        const CY = HEIGHT / 2;

        // Kalp noktalarını oluştur
        const points = [];
        for (let i = 0; i < 500; i++) {
            let t = (2 * Math.PI * i) / 500;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            let scale = 24;
            let px = CX + x * scale;
            let py = CY - y * scale;
            points.push({ x: px, y: py });
        }

        let angle = 0;

        function animate() {
            // Arka planı temizle
            ctx.fillStyle = 'rgb(3, 3, 10)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            let a = angle * (Math.PI / 180);

            // Kalp çizgilerini çiz
            points.forEach((point, i) => {
                let dx = point.x - CX;
                let dy = point.y - CY;

                let rx = dx * Math.cos(a) - dy * Math.sin(a);
                let ry = dx * Math.sin(a) + dy * Math.cos(a);

                let endX = CX + rx;
                let endY = CY + ry;

                // Mor -> mavi renk geçişi
                let colorValue = Math.floor(120 + 100 * Math.sin(i * 0.04 + angle * 0.03));
                let blueComponent = Math.max(150, colorValue);

                ctx.strokeStyle = `rgb(80, 60, ${blueComponent})`;
                ctx.lineWidth = 1;

                ctx.beginPath();
                ctx.moveTo(CX, CY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            });

            // Ortadaki parlak nokta
            ctx.fillStyle = 'rgb(130, 180, 255)';
            ctx.beginPath();
            ctx.arc(CX, CY, 5, 0, Math.PI * 2);
            ctx.fill();

            angle += 0.35;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
